name: Scan token
on:
  workflow_dispatch:
    inputs:
      token:
        description: "Token contract address"
        required: true
        default: "0x73c2de14c7fa0a57cc2d9722b959ea70b881ffe4"
      watchlist:
        description: "Optional: known winner tokens, comma-separated (address|SYMBOL)"
        required: false
        default: ""
permissions:
  contents: write
concurrency:
  group: whale-scanner-save
  cancel-in-progress: false
jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - name: Run scanner
        env:
          BLOCKSCOUT_API_KEY: ${{ secrets.BLOCKSCOUT_API_KEY }}
          TOKEN: ${{ github.event.inputs.token }}
          WATCHLIST: ${{ github.event.inputs.watchlist }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python scanner.py
      - name: Save results
        run: |
          git config user.name "scanner-bot"
          git config user.email "bot@users.noreply.github.com"
          git add docs
          git commit -m "scan results" || echo "nothing to commit"
          for i in 1 2 3 4 5; do
            git pull --rebase origin main && git push && break
            echo "push attempt $i failed, retrying..."
            sleep $((RANDOM % 5 + 2))
          done
